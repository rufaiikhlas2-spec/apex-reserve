<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Reserve - Dashboard</title>
  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      color: var(--accent-color);
    }

    header p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 16px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    #statusMessage {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Apex Reserve</h1>
      <p>Secure Telegram Deposit Gateway</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="depositAmount">Deposit Amount (₦)</label>
        <input type="number" id="depositAmount" placeholder="e.g. 10000" />
      </div>

      <div class="form-group">
        <label for="depositProof">Payment Reference / Note</label>
        <input type="text" id="depositProof" placeholder="e.g. Teller ID / Bank Name" />
      </div>

      <button onclick="submitDeposit()">Submit Deposit Request</button>
      <div id="statusMessage"></div>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp UI
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    async function submitDeposit() {
      const amount = document.getElementById('depositAmount').value;
      const proof = document.getElementById('depositProof').value;
      const statusDiv = document.getElementById('statusMessage');

      if (!amount) {
        statusDiv.style.color = "#ef4444";
        statusDiv.innerText = "Please enter a valid amount.";
        return;
      }

      // Extract Telegram User Details safely
      const user = tg.initDataUnsafe?.user || { id: "web_user", username: "WebUser" };

      statusDiv.style.color = var(--text-muted);
      statusDiv.innerText = "Sending deposit request...";

      try {
        const response = await fetch("https://muddy-lab-4e76.ikhlasklash.workers.dev/deposit", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json" 
          },
          body: JSON.stringify({
            userId: user.id,
            username: user.username || "Anonymous",
            amount: amount,
            proof: proof || "Direct Transfer"
          })
        });

        const result = await response.json();
        
        if (result.success) {
          statusDiv.style.color = "#22c55e";
          statusDiv.innerText = "Deposit submitted! Admin notified.";
          document.getElementById('depositAmount').value = "";
          document.getElementById('depositProof').value = "";
        } else {
          statusDiv.style.color = "#ef4444";
          statusDiv.innerText = "Submission failed. Try again.";
        }
      } catch (err) {
        console.error("Error:", err);
        statusDiv.style.color = "#ef4444";
        statusDiv.innerText = "Network error. Check connection.";
      }
    }
  </script>
</body>
</html>
